<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:description" content="Get a random capybara picture, courtesy of the Capy.lol API.">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Titan+One&display=swap');

        :root {
            --bg-main: #0bc2cf;
            --bg-texture: linear-gradient(45deg, rgba(255, 255, 255, .08) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, .08) 75%);
            --bg-texture-size: 80px 80px;
            --hero-text-shadow: 4px 4px 0 #222, 8px 8px 12px rgba(0, 0, 0, .2);
            --subtitle-shadow: #222;
            --surface: #ffffff;
            --surface-alt: #f5f5f5;
            --ink: #222222;
            --ink-soft: #555b61;
            --label-soft: #64748b;
            --border: #333333;
            --shadow: #333333;
            --danger: #ff6b6b;
            --toast-bg: #222222;
            --toast-text: #ffffff;
            --purple: #7c3aed;
            --purple-bg: #f3e8ff;
            --purple-row: #ede9fe;
            --purple-bar: #a78bfa;
            --purple-bar-alt: #818cf8;
        }

        [data-theme="dark"] {
            --bg-main: #14161f;
            --bg-texture: linear-gradient(45deg, rgba(255, 255, 255, .05) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, .05) 75%);
            --bg-texture-size: 80px 80px;
            --hero-text-shadow: 4px 4px 0 #000, 8px 8px 12px rgba(0, 0, 0, .4);
            --subtitle-shadow: #000;
            --surface: #23263a;
            --surface-alt: #2b2f45;
            --ink: #f2f2f2;
            --ink-soft: #c7c7c7;
            --label-soft: #9599b8;
            --border: #4a4d63;
            --shadow: #4a4d63;
            --toast-bg: #eef2f6;
            --toast-text: #16212c;
            --purple: #a78bfa;
            --purple-bg: #1a1428;
            --purple-row: #221d35;
            --purple-bar: #7c3aed;
            --purple-bar-alt: #6366f1;
        }

        /* ── SEASONAL THEMES ── */
        [data-theme="winter"] {
            --bg-main: linear-gradient(180deg, #0b192c 0%, #1e3e62 45%, #000000 100%);
            --bg-texture: linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%),
                          linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%);
            --bg-texture-size: 80px 80px;
            --hero-text-shadow: 3px 3px 0 #00b4d8, 6px 6px 0 #03045e, 0 12px 24px rgba(0,0,0,.4);
            --subtitle-shadow: #03045e;
            --border: #132242;
            --shadow: #132242;
            --purple: #a78bfa;
            --purple-bg: #1a1428;
            --purple-row: #221d35;
            --purple-bar: #7c3aed;
            --purple-bar-alt: #6366f1;
        }

        [data-theme="spring"] {
            --bg-main: linear-gradient(180deg, #1b4332 0%, #2d6a4f 45%, #40916c 100%);
            --bg-texture: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0px, rgba(255,255,255,.06) 8px, transparent 8px, transparent 16px);
            --bg-texture-size: 80px 80px;
            --hero-text-shadow: 3px 3px 0 #52b788, 6px 6px 0 #081c15, 0 12px 24px rgba(0,0,0,.4);
            --subtitle-shadow: #081c15;
            --border: #132242;
            --shadow: #132242;
            --purple: #a78bfa;
            --purple-bg: #1a1428;
            --purple-row: #221d35;
            --purple-bar: #7c3aed;
            --purple-bar-alt: #6366f1;
        }

        [data-theme="independence"] {
            --bg-main: linear-gradient(180deg, #0a1a3f 0%, #14264f 45%, #b22234 100%);
            --bg-texture: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0px, rgba(255, 255, 255, .035) 40px, transparent 40px, transparent 80px);
            --bg-texture-size: auto;
            --hero-text-shadow: 3px 3px 0 #b22234, 6px 6px 0 #0a1a3f, 0 12px 24px rgba(0,0,0,.4);
            --subtitle-shadow: #0a1a3f;
            --border: #132242;
            --shadow: #132242;
            --purple: #a78bfa;
            --purple-bg: #1a1428;
            --purple-row: #221d35;
            --purple-bar: #7c3aed;
            --purple-bar-alt: #6366f1;
        }

        [data-theme="autumn"] {
            --bg-main: linear-gradient(180deg, #43281c 0%, #6f1d1b 45%, #99582a 100%);
            --bg-texture: linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%),
                          linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%);
            --bg-texture-size: 80px 80px;
            --hero-text-shadow: 3px 3px 0 #bb3e03, 6px 6px 0 #28110b, 0 12px 24px rgba(0,0,0,.4);
            --subtitle-shadow: #28110b;
            --border: #132242;
            --shadow: #132242;
            --purple: #a78bfa;
            --purple-bg: #1a1428;
            --purple-row: #221d35;
            --purple-bar: #7c3aed;
            --purple-bar-alt: #6366f1;
        }

        [data-theme="seasonal"] {
            --bg-main: linear-gradient(180deg, #0a1a3f 0%, #14264f 45%, #b22234 100%);
            --bg-texture: linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%),
                          linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%);
            --bg-texture-size: 80px 80px;
            --hero-text-shadow: 3px 3px 0 #b22234, 6px 6px 0 #0a1a3f, 0 12px 24px rgba(0,0,0,.4);
            --subtitle-shadow: #0a1a3f;
            --border: #132242;
            --shadow: #132242;
            --purple: #a78bfa;
            --purple-bg: #1a1428;
            --purple-row: #221d35;
            --purple-bar: #7c3aed;
            --purple-bar-alt: #6366f1;
        }

        [data-theme="custom"] {
            --bg-main: var(--custom-primary);
            --bg-texture: var(--custom-texture);
            --bg-texture-size: var(--custom-texture-size);
            --hero-text-shadow: 4px 4px 0 var(--custom-shadow), 8px 8px 12px rgba(0, 0, 0, .25);
            --subtitle-shadow: var(--custom-shadow);
            --surface: var(--custom-surface);
            --surface-alt: var(--custom-surface-alt);
            --ink: var(--custom-ink);
            --ink-soft: var(--custom-ink-soft);
            --label-soft: var(--custom-label-soft);
            --border: var(--custom-border);
            --shadow: var(--custom-shadow);
            --purple: var(--custom-purple);
            --purple-bg: var(--custom-purple-bg);
            --purple-row: var(--custom-purple-row);
            --purple-bar: var(--custom-purple-bar);
            --purple-bar-alt: var(--custom-purple-bar-alt);
            --toast-bg: var(--custom-ink);
            --toast-text: var(--custom-surface);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-weight: 800; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
            transition: background .3s ease;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--bg-texture);
            background-size: var(--bg-texture-size);
            z-index: -4;
        }

        .star {
            position: fixed;
            background: #fff;
            border-radius: 50%;
            z-index: -3;
            display: none;
            animation-name: twinkle;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            pointer-events: none;
        }
        [data-theme="winter"] .star,
        [data-theme="spring"] .star,
        [data-theme="independence"] .star,
        [data-theme="autumn"] .star,
        [data-theme="seasonal"] .star {
            display: block;
        }
        @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }

        .snowflake {
            position: fixed;
            top: -10vh;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: -2;
            box-shadow: 0 0 6px rgba(255, 255, 255, .8);
            animation: fallSnow linear forwards;
        }
        @keyframes fallSnow {
            0% { transform: translateY(0) translateX(0); opacity: .8; }
            100% { transform: translateY(120vh) translateX(30px); opacity: 0; }
        }

        #fw-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

        .blook {
            position: fixed;
            top: -150px;
            opacity: .25;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: -2;
        }
        .blook-seasonal { display: none; opacity: .15; }
        [data-theme="winter"] .blook-seasonal,
        [data-theme="spring"] .blook-seasonal,
        [data-theme="independence"] .blook-seasonal,
        [data-theme="autumn"] .blook-seasonal,
        [data-theme="seasonal"] .blook-seasonal { display: block; }
        [data-theme="winter"] .blook-normal,
        [data-theme="spring"] .blook-normal,
        [data-theme="independence"] .blook-normal,
        [data-theme="autumn"] .blook-normal,
        [data-theme="seasonal"] .blook-normal { display: none; }
        .blook-custom {
            display: none;
            opacity: .3;
            font-size: 40px;
            position: fixed;
            top: -80px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: -2;
        }
        [data-theme="custom"] .blook-custom { display: block; }
        [data-theme="custom"] .blook-normal,
        [data-theme="custom"] .blook-seasonal { display: none; }
        @keyframes fall {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(120vh) rotate(360deg); }
        }

        h1 {
            text-align: center;
            color: white;
            font-family: 'Titan One', cursive;
            font-size: 3.5rem;
            margin-top: 25px;
            text-shadow: var(--hero-text-shadow);
            padding: 0 15px;
            letter-spacing: 2px;
        }
        .subtitle {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 var(--subtitle-shadow);
        }

        .quick-controls { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 250; }
        .quick-btn {
            width: 42px; height: 42px; border-radius: 50%;
            border: 3px solid var(--border); background: var(--surface); color: var(--ink);
            box-shadow: 0 4px 0 var(--shadow); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 15px; transition: .15s; padding: 0;
        }
        .quick-btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
        @media (max-width: 480px) {
            .quick-controls { top: 10px; right: 10px; }
            .quick-btn { width: 36px; height: 36px; font-size: 13px; }
        }

        .container { width: 92%; max-width: 560px; margin: auto; }

        .capy-card {
            background: var(--surface);
            border: 4px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 8px 0 var(--shadow);
            padding: 20px;
            text-align: center;
            transition: background-color .3s ease, border-color .3s ease;
        }

        .capy-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            border: 4px solid var(--border);
            background: var(--surface-alt);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .capy-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity .35s ease;
        }
        .capy-frame img.loaded { opacity: 1; }

        .capy-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #eef1f4 25%, rgba(255,255,255,.75) 37%, #eef1f4 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
        }
        [data-theme="dark"] .capy-skeleton,
        [data-theme="winter"] .capy-skeleton,
        [data-theme="spring"] .capy-skeleton,
        [data-theme="independence"] .capy-skeleton,
        [data-theme="autumn"] .capy-skeleton,
        [data-theme="seasonal"] .capy-skeleton {
            background: linear-gradient(90deg, #23263a 25%, rgba(255,255,255,.10) 37%, #23263a 63%);
            background-size: 400% 100%;
        }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        .capy-error { display: none; padding: 20px; color: var(--ink); font-size: 15px; }

        .capy-alt { margin-top: 14px; color: var(--ink-soft); font-size: 14px; font-weight: 800; min-height: 20px; }
        .capy-meta { margin-top: 4px; color: var(--label-soft); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }

        .capy-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
        .capy-btn {
            background: #ef4444;
            color: white;
            border: 3px solid #991b1b;
            border-radius: 12px;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: 900;
            font-family: 'Nunito', sans-serif;
            box-shadow: 0 5px 0 #991b1b;
            cursor: pointer;
            transition: .15s;
        }
        .capy-btn:hover { transform: translateY(2px); box-shadow: 0 3px 0 #991b1b; }
        .capy-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #991b1b; }
        .capy-btn:disabled { opacity: .6; cursor: default; transform: none; box-shadow: 0 5px 0 #991b1b; }

        .capy-btn.secondary { background: var(--surface-alt); color: var(--ink); border: 3px solid var(--border); box-shadow: 0 5px 0 var(--shadow); }
        .capy-btn.secondary:hover { box-shadow: 0 3px 0 var(--shadow); }
        .capy-btn i { margin-right: 6px; }

        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            width: 90%;
            max-width: 360px;
        }
        .toast {
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .25s ease, transform .25s ease;
            border: 2px solid var(--border);
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* ── SIDEBAR ── */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 1400;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }
        .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
        .sidebar {
            --sb-purple: #a34bc7;
            --sb-purple-dark: #7f3a9c;
            --sb-teal: #22d3c5;
            --sb-teal-dark: #17a89d;
            position: fixed;
            top: 0;
            left: -300px;
            width: 260px;
            max-width: 85vw;
            height: 100vh;
            background: var(--sb-purple);
            border-right: 4px solid var(--sb-purple-dark);
            z-index: 1500;
            transition: left .3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 6px 0 20px rgba(0, 0, 0, .3);
            overflow-y: auto;
        }
        .sidebar.show { left: 0; }
        .sidebar-header { display: flex; justify-content: center; align-items: center; position: relative; padding: 22px 20px 14px; }
        .sidebar-header h3 {
            font-family: 'Titan One', cursive;
            font-size: 1.6rem;
            color: white;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 var(--sb-purple-dark);
        }
        .sidebar-home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 4px 18px 16px;
            padding: 12px 0;
            background: var(--sb-teal);
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 0 var(--sb-teal-dark);
            color: white;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 16px;
            text-decoration: none;
            transition: .15s;
        }
        .sidebar-home-btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 var(--sb-teal-dark); }
        .sidebar-home-btn .sb-icon { font-size: 18px; }
        .sidebar-links { flex: 0 0 auto; overflow-y: visible; padding: 0 12px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            text-decoration: none;
            color: rgba(255, 255, 255, .9);
            font-weight: 800;
            font-size: 15px;
            transition: .15s;
        }
        .sidebar-links a:hover { background: rgba(255, 255, 255, .12); }
        .sidebar-links a.active { background: white; color: var(--sb-purple); box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
        .sidebar-links a .sb-icon { font-size: 20px; width: 24px; text-align: center; display: inline-block; transition: transform .2s ease; }
        .sidebar-links a:hover .sb-icon { transform: translateX(3px) scale(1.1); }
        .sidebar-divider { height: 1px; background: rgba(255, 255, 255, .25); margin: 10px 8px; }
        .sidebar-themes { padding: 16px 18px 20px; border-top: 1px solid rgba(255, 255, 255, .25); margin-top: auto; }
        .sidebar-themes h4 {
            font-family: 'Titan One', cursive;
            font-size: .85rem;
            margin-bottom: 10px;
            color: white;
            letter-spacing: .5px;
            opacity: .9;
            font-weight: normal;
        }
        .theme-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .theme-swatch {
            flex: 1;
            min-width: 50px;
            padding: 10px 4px;
            border-radius: 12px;
            border: 3px solid rgba(0, 0, 0, .25);
            cursor: pointer;
            text-align: center;
            font-weight: 900;
            font-size: 11px;
            transition: .15s;
            color: white;
        }
        .theme-swatch:hover { transform: translateY(-2px); }
        .theme-swatch.active { outline: 3px solid #ffd700; outline-offset: 2px; }
        .theme-swatch.normal { background: #0bc2cf; }
        .theme-swatch.dark { background: #23263a; }
        .theme-swatch.seasonal-trigger { background: linear-gradient(135deg, #f72585, #b5179e); }

        .seasonal-submenu {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            padding-left: 10px;
            border-left: 3px solid rgba(255,255,255,0.3);
        }
        .seasonal-submenu.show { display: flex; }
        .theme-swatch.seasonal-sub { background: linear-gradient(135deg, #14264f, #b22234); font-size: 11px; }
        .theme-swatch.custom-swatch { background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff); font-size: 10px; }

        .custom-theme-builder {
            display: none;
            margin-top: 12px;
            padding: 14px;
            background: rgba(255, 255, 255, .1);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, .2);
        }
        .custom-theme-builder.show { display: block; }
        .custom-theme-builder label {
            display: block;
            color: white;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            margin-top: 10px;
        }
        .custom-theme-builder label:first-child { margin-top: 0; }
        .custom-theme-builder input[type="color"] {
            width: 100%;
            height: 38px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            padding: 2px;
        }
        .custom-theme-builder .texture-presets { display: flex; gap: 6px; flex-wrap: wrap; }
        .custom-theme-builder .texture-preset-btn {
            flex: 1;
            min-width: 36px;
            padding: 8px 4px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, .3);
            cursor: pointer;
            font-size: 10px;
            font-weight: 900;
            color: white;
            text-align: center;
            transition: .15s;
            background: rgba(0, 0, 0, .25);
        }
        .custom-theme-builder .texture-preset-btn:hover { border-color: #ffd700; }
        .custom-theme-builder .texture-preset-btn.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, .25);
            outline: 2px solid #ffd700;
            outline-offset: 1px;
        }
        .custom-theme-builder input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 3px solid rgba(255, 255, 255, .3);
            background: rgba(0, 0, 0, .25);
            color: white;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
        }
        .custom-theme-builder input[type="text"]::placeholder { color: rgba(255, 255, 255, .5); }
        .custom-theme-apply-btn {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            border-radius: 10px;
            border: 3px solid #ffd700;
            background: rgba(255, 215, 0, .2);
            color: #ffd700;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;

    <script>
        const CAPY_API_URL = "https://api.capy.lol/v1/capybara?json=true";

        const CUSTOM_THEME_KEY = 'blooktools_custom_theme';
        let customThemeSettings = { primaryColor: '#0bc2cf', textureStyle: 'dots', floatEmoji: '⭐', enabled: false };
        let soundMuted = false;
        let currentCapyUrl = null;
        const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function loadCustomThemeSettings() {
            try {
                const stored = localStorage.getItem(CUSTOM_THEME_KEY);
                if (stored) { const parsed = JSON.parse(stored); customThemeSettings = { ...customThemeSettings, ...parsed }; }
            } catch (e) {}
        }
        function saveCustomThemeSettings() { try { localStorage.setItem(CUSTOM_THEME_KEY, JSON.stringify(customThemeSettings)); } catch (e) {} }

        function getTextureCSS(style) {
            switch (style) {
                case 'dots': return { texture: 'radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1px)', size: '24px 24px' };
                case 'stripes': return { texture: 'repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0px, rgba(255,255,255,.06) 8px, transparent 8px, transparent 16px)', size: 'auto' };
                case 'grid': return { texture: 'linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px)', size: '32px 32px' };
                case 'gradient': return { texture: 'linear-gradient(180deg, rgba(255,255,255,.10) 0%, transparent 60%, rgba(0,0,0,.08) 100%)', size: 'auto' };
                case 'clean': return { texture: 'none', size: 'auto' };
                default: return { texture: 'radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1px)', size: '24px 24px' };
            }
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 11, g: 194, b: 207 };
        }
        function adjustColor(hex, amount) { const { r, g, b } = hexToRgb(hex); const clamp = (v) => Math.max(0, Math.min(255, v + amount)); return `rgb(${clamp(r)},${clamp(g)},${clamp(b)})`; }
        function isLightColor(hex) { const { r, g, b } = hexToRgb(hex); const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255; return luminance > 0.55; }

        function applyCustomThemeCSS() {
            const root = document.documentElement;
            const { primaryColor, textureStyle } = customThemeSettings;
            const textureData = getTextureCSS(textureStyle);
            const light = isLightColor(primaryColor);
            const ink = light ? '#1a1a1a' : '#f2f2f2';
            const surface = light ? '#ffffff' : '#1e2130';
            const surfaceAlt = light ? '#f5f5f5' : '#282c40';
            root.style.setProperty('--custom-primary', primaryColor);
            root.style.setProperty('--custom-texture', textureData.texture);
            root.style.setProperty('--custom-texture-size', textureData.size);
            root.style.setProperty('--custom-shadow', adjustColor(primaryColor, -60));
            root.style.setProperty('--custom-border', adjustColor(primaryColor, -50));
            root.style.setProperty('--custom-ink', ink);
            root.style.setProperty('--custom-ink-soft', light ? '#444' : '#c7c7c7');
            root.style.setProperty('--custom-label-soft', light ? '#64748b' : '#9599b8');
            root.style.setProperty('--custom-surface', surface);
            root.style.setProperty('--custom-surface-alt', surfaceAlt);
            root.style.setProperty('--custom-purple', light ? '#7c3aed' : '#a78bfa');
            root.style.setProperty('--custom-purple-bg', light ? '#f3e8ff' : '#1a1428');
            root.style.setProperty('--custom-purple-row', light ? '#ede9fe' : '#221d35');
            root.style.setProperty('--custom-purple-bar', light ? '#a78bfa' : '#7c3aed');
            root.style.setProperty('--custom-purple-bar-alt', light ? '#818cf8' : '#6366f1');
        }

        function spawnCustomFloats() {
            const container = document.getElementById('customFloatsContainer');
            if (!container) return;
            container.innerHTML = '';
            const emoji = customThemeSettings.floatEmoji || '⭐';
            const chars = Array.from(emoji).slice(0, 6);
            if (chars.length === 0) chars.push('⭐');
            const positions = [{ left: '5%', dur: '16s', delay: '-2s' }, { left: '75%', dur: '20s', delay: '-8s' }, { left: '45%', dur: '18s', delay: '-12s' }, { left: '20%', dur: '14s', delay: '-5s' }, { left: '85%', dur: '17s', delay: '-1s' }, { left: '35%', dur: '19s', delay: '-10s' }, { left: '60%', dur: '15s', delay: '-14s' }, { left: '12%', dur: '13s', delay: '-7s' }, { left: '90%', dur: '21s', delay: '-4s' }, { left: '50%', dur: '22s', delay: '-18s' }];
            chars.forEach((ch, i) => {
                const pos = positions[i % positions.length];
                const span = document.createElement('span');
                span.className = 'blook-custom';
                span.textContent = ch;
                span.style.cssText = `left:${pos.left};animation-duration:${pos.dur};animation-delay:${pos.delay};font-size:${35 + Math.random()*30}px;`;
                container.appendChild(span);
            });
        }

        function applyCustomTheme() {
            if (!customThemeSettings.enabled) return;
            applyCustomThemeCSS();
            spawnCustomFloats();
            document.documentElement.setAttribute('data-theme', 'custom');
            document.querySelectorAll('.theme-swatch').forEach(el => {
                const isActive = el.dataset.theme === 'custom';
                el.classList.toggle('active', isActive);
                el.setAttribute('aria-pressed', String(isActive));
            });
            document.getElementById('customThemeBuilder').classList.add('show');
            document.getElementById('customPrimaryColor').value = customThemeSettings.primaryColor;
            document.getElementById('customFloatEmoji').value = customThemeSettings.floatEmoji;
            document.querySelectorAll('#customTexturePresets .texture-preset-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.texture === customThemeSettings.textureStyle);
            });
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = message;
            container.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2400);
        }

        const THEME_KEY = 'blooktools_theme';
        const seasonalThemes = ['winter', 'spring', 'independence', 'autumn'];

        function applyTheme(theme) {
            if (theme === 'custom') {
                customThemeSettings.enabled = true;
                saveCustomThemeSettings();
                applyCustomTheme();
                if (window.stopFireworks) window.stopFireworks();
                if (window.stopSnow) window.stopSnow();
                return;
            }

            customThemeSettings.enabled = false;
            saveCustomThemeSettings();

            document.getElementById('customThemeBuilder').classList.remove('show');
            document.getElementById('customFloatsContainer').innerHTML = '';

            const root = document.documentElement;
            ['--custom-primary', '--custom-texture', '--custom-texture-size', '--custom-shadow', '--custom-border', '--custom-ink', '--custom-ink-soft', '--custom-label-soft', '--custom-surface', '--custom-surface-alt', '--custom-purple', '--custom-purple-bg', '--custom-purple-row', '--custom-purple-bar', '--custom-purple-bar-alt'].forEach(p => root.style.removeProperty(p));

            document.documentElement.setAttribute('data-theme', theme);

            const isSeasonal = seasonalThemes.includes(theme);

            document.querySelectorAll('.theme-swatch[data-theme]').forEach(el => {
                const isActive = el.dataset.theme === theme;
                el.classList.toggle('active', isActive);
                el.setAttribute('aria-pressed', String(isActive));
            });

            const seasonalTrigger = document.getElementById('seasonalTrigger');
            if (seasonalTrigger) {
                seasonalTrigger.classList.toggle('active', isSeasonal);
                seasonalTrigger.setAttribute('aria-pressed', String(isSeasonal));
            }

            try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}

            if (window.stopFireworks) window.stopFireworks();
            if (window.stopSnow) window.stopSnow();

            if (theme === 'independence' || theme === 'seasonal') {
                if (window.startFireworks) window.startFireworks();
            } else if (theme === 'winter') {
                if (window.startSnow) window.startSnow();
            }
        }

        function loadTheme() {
            let theme = 'normal';
            try { theme = localStorage.getItem(THEME_KEY) || 'normal'; } catch (e) {}
            if (theme === 'seasonal') theme = 'independence';

            loadCustomThemeSettings();

            if (customThemeSettings.enabled) {
                applyCustomTheme();
                if (window.stopFireworks) window.stopFireworks();
                if (window.stopSnow) window.stopSnow();
                document.querySelectorAll('.theme-swatch[data-theme]').forEach(el => {
                    el.classList.toggle('active', el.dataset.theme === 'custom');
                    el.setAttribute('aria-pressed', String(el.dataset.theme === 'custom'));
                });
            } else {
                applyTheme(theme);
            }
        }

        function selectTheme(theme) {
            if (theme === 'custom') {
                document.getElementById('customThemeBuilder').classList.toggle('show');
                const builder = document.getElementById('customThemeBuilder');
                if (builder.classList.contains('show')) {
                    document.getElementById('customPrimaryColor').value = customThemeSettings.primaryColor;
                    document.getElementById('customFloatEmoji').value = customThemeSettings.floatEmoji;
                    document.querySelectorAll('#customTexturePresets .texture-preset-btn').forEach(btn => {
                        btn.classList.toggle('selected', btn.dataset.texture === customThemeSettings.textureStyle);
                    });
                    showToast('Customize your theme below 👇');
                }
                return;
            }

            document.getElementById('customThemeBuilder').classList.remove('show');
            applyTheme(theme);

            const labels = {
                normal: 'Normal theme on ☀️',
                dark: 'Dark mode on 🌙',
                winter: 'Winter theme on ❄️',
                spring: 'Spring theme on 🌸',
                independence: 'Independence theme on 🎆',
                autumn: 'Autumn theme on 🍂'
            };
            showToast(labels[theme] || 'Theme updated');
        }

        function applyCustomThemeFromBuilder() {
            customThemeSettings.primaryColor = document.getElementById('customPrimaryColor').value;
            customThemeSettings.floatEmoji = document.getElementById('customFloatEmoji').value || '⭐';
            const selectedTexture = document.querySelector('#customTexturePresets .texture-preset-btn.selected');
            customThemeSettings.textureStyle = selectedTexture ? selectedTexture.dataset.texture : 'dots';
            customThemeSettings.enabled = true;
            saveCustomThemeSettings();
            applyCustomTheme();
            showToast('Custom theme applied! 🎨');
        }

        function resetCustomTheme() {
            customThemeSettings = { primaryColor: '#0bc2cf', textureStyle: 'dots', floatEmoji: '⭐', enabled: false };
            saveCustomThemeSettings();
            document.getElementById('customThemeBuilder').classList.remove('show');
            document.getElementById('customFloatsContainer').innerHTML = '';
            const root = document.documentElement;
            ['--custom-primary', '--custom-texture', '--custom-texture-size', '--custom-shadow', '--custom-border', '--custom-ink', '--custom-ink-soft', '--custom-label-soft', '--custom-surface', '--custom-surface-alt', '--custom-purple', '--custom-purple-bg', '--custom-purple-row', '--custom-purple-bar', '--custom-purple-bar-alt'].forEach(p => root.style.removeProperty(p));
            applyTheme('normal');
            showToast('Custom theme reset');
        }

        function toggleMute() {
            soundMuted = !soundMuted;
            const icon = document.getElementById('muteIcon');
            if (icon) icon.className = soundMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            const btn = document.getElementById('muteBtn');
            if (btn) btn.setAttribute('aria-label', soundMuted ? 'Unmute sound effects' : 'Mute sound effects');
            showToast(soundMuted ? 'Sound effects muted' : 'Sound effects on');
        }

        (function() {
            var canvas = document.getElementById('fw-canvas');
            var ctx = canvas.getContext('2d');
            var w, h, running = false, rafId = null;
            function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
            resize();
            window.addEventListener('resize', resize);
            var fwReduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var COLORS = ['#ff4d4d', '#ffffff', '#5c8bff', '#ffd700'];
            function rand(min, max) { return Math.random() * (max - min) + min; }
            function pick(arr) { return arr[Math.floor(rand(0, arr.length))]; }
            var rockets = [], sparks = [], flashes = [];

            function Rocket() {
                this.x = rand(w * 0.12, w * 0.88); this.y = h + 10; this.targetY = rand(h * 0.14, h * 0.42);
                this.vx = rand(-0.5, 0.5); this.vy = rand(-9.5, -7.5); this.color = pick(COLORS); this.trail = [];
            }
            Rocket.prototype.update = function() { this.trail.push({ x: this.x, y: this.y }); if (this.trail.length > 5) this.trail.shift(); this.vy += 0.09; this.x += this.vx; this.y += this.vy; };
            Rocket.prototype.draw = function() {
                ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
                for (var i = 0; i < this.trail.length; i++) { var p = this.trail[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
                ctx.lineTo(this.x, this.y); ctx.stroke();
            };
            Rocket.prototype.spent = function() { return this.vy >= -0.6 || this.y <= this.targetY; };

            function Spark(x, y, color) {
                this.x = x; this.y = y; var angle = rand(0, Math.PI * 2); var speed = rand(1.2, 6.2);
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed; this.color = color;
                this.life = 1; this.decay = rand(0.012, 0.02); this.size = rand(1.4, 2.8);
            }
            Spark.prototype.update = function() { this.vy += 0.045; this.vx *= 0.98; this.vy *= 0.98; this.x += this.vx; this.y += this.vy; this.life -= this.decay; };
            Spark.prototype.draw = function() { if (this.life <= 0) return; ctx.globalAlpha = Math.max(this.life, 0); ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; };
            Spark.prototype.dead = function() { return this.life <= 0; };

            function Flash(x, y, color) { this.x = x; this.y = y; this.color = color; this.life = 1; }
            Flash.prototype.update = function() { this.life -= 0.09; };
            Flash.prototype.draw = function() {
                if (this.life <= 0) return; var r = (1 - this.life) * 46 + 6;
                var grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                grad.addColorStop(0, this.color); grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.globalAlpha = Math.max(this.life, 0) * 0.8; ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
            };
            Flash.prototype.dead = function() { return this.life <= 0; };

            var lastSpawn = 0, nextGap = rand(700, 1500);
            function explode(x, y, color) {
                flashes.push(new Flash(x, y, color));
                var count = Math.floor(rand(45, 65));
                for (var i = 0; i < count; i++) sparks.push(new Spark(x, y, color));
                if (Math.random() < 0.5) { var color2 = pick(COLORS); var count2 = Math.floor(count * 0.4); for (var j = 0; j < count2; j++) sparks.push(new Spark(x, y, color2)); }
            }

            function loop(ts) {
                if (!running) return;
                ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, 0, w, h); ctx.globalCompositeOperation = 'source-over';
                if (ts - lastSpawn > nextGap) { rockets.push(new Rocket()); lastSpawn = ts; nextGap = rand(700, 1500); }
                for (var i = rockets.length - 1; i >= 0; i--) { var r = rockets[i]; r.update(); r.draw(); if (r.spent()) { explode(r.x, r.y, r.color); rockets.splice(i, 1); } }
                for (var j = flashes.length - 1; j >= 0; j--) { flashes[j].update(); flashes[j].draw(); if (flashes[j].dead()) flashes.splice(j, 1); }
                for (var k = sparks.length - 1; k >= 0; k--) { sparks[k].update(); sparks[k].draw(); if (sparks[k].dead()) sparks.splice(k, 1); }
                rafId = requestAnimationFrame(loop);
            }
            window.startFireworks = function() { if (running || fwReduceMotion) return; running = true; rockets = []; sparks = []; flashes = []; lastSpawn = 0; rafId = requestAnimationFrame(loop); };
            window.stopFireworks = function() { running = false; if (rafId) cancelAnimationFrame(rafId); ctx.clearRect(0, 0, w, h); rockets = []; sparks = []; flashes = []; };
        })();

        let snowInterval = null;
        function startSnow() {
            if (snowInterval) return;
            snowInterval = setInterval(() => {
                const snow = document.createElement('div');
                snow.classList.add('snowflake');
                snow.style.left = Math.random() * 100 + 'vw';
                const size = Math.random() * 5 + 3;
                snow.style.width = size + 'px';
                snow.style.height = size + 'px';
                const duration = Math.random() * 4 + 4;
                snow.style.animationDuration = duration + 's';
                document.body.appendChild(snow);
                setTimeout(() => snow.remove(), duration * 1000);
            }, 150);
        }
        function stopSnow() {
            clearInterval(snowInterval);
            snowInterval = null;
            document.querySelectorAll('.snowflake').forEach(s => s.remove());
        }

        function openSidebar() { document.getElementById('sidebarOverlay').classList.add('show'); document.getElementById('siteSidebar').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebarOverlay').classList.remove('show'); document.getElementById('siteSidebar').classList.remove('show'); }

        async function fetchCapybara() {
            const btn = document.getElementById('newCapyBtn');
            const img = document.getElementById('capyImg');
            const skeleton = document.getElementById('capySkeleton');
            const errorBox = document.getElementById('capyError');
            const altBox = document.getElementById('capyAlt');
            const metaBox = document.getElementById('capyMeta');

            btn.disabled = true;
            errorBox.style.display = 'none';
            img.classList.remove('loaded');
            skeleton.style.display = 'block';
            altBox.textContent = '';
            metaBox.textContent = '';

            try {
                const res = await fetch(CAPY_API_URL);
                if (!res.ok) throw new Error('Bad response: ' + res.status);
                const data = await res.json();
                if (!data.success || !data.data || !data.data.url) throw new Error('Malformed response');

                const capy = data.data;
                await new Promise((resolve, reject) => {
                    const preload = new Image();
                    preload.onload = resolve;
                    preload.onerror = reject;
                    preload.src = capy.url;
                });

                img.src = capy.url;
                img.alt = capy.alt || 'A random capybara';
                currentCapyUrl = capy.url;

                img.onload = () => { img.classList.add('loaded'); skeleton.style.display = 'none'; };
                altBox.textContent = capy.alt || '';
                metaBox.textContent = `#${capy.index} · ${capy.width}×${capy.height}`;
            } catch (err) {
                console.error(err);
                skeleton.style.display = 'none';
                errorBox.style.display = 'block';
                showToast('Failed to fetch a capybara 😿');
            } finally {
                btn.disabled = false;
            }
        }

        function downloadCapy() {
            if (!currentCapyUrl) { showToast('Grab a capybara first!'); return; }
            const link = document.createElement('a');
            link.href = currentCapyUrl;
            link.target = '_blank';
            link.rel = 'noopener';
            link.download = 'capybara.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function initEvents() {
            document.getElementById('siteTitleTrigger').addEventListener('click', openSidebar);
            document.getElementById('siteTitleTrigger').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSidebar(); } });
            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
            document.querySelectorAll('.sidebar-links a[data-page]').forEach(a => { a.classList.toggle('active', a.dataset.page === 'capybara'); });
            document.getElementById('muteBtn').addEventListener('click', toggleMute);

            const seasonalTrigger = document.getElementById('seasonalTrigger');
            const seasonalSubmenu = document.getElementById('seasonalSubmenu');
            if (seasonalTrigger && seasonalSubmenu) {
                const toggleSeasonalMenu = () => seasonalSubmenu.classList.toggle('show');
                seasonalTrigger.addEventListener('click', toggleSeasonalMenu);
                seasonalTrigger.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSeasonalMenu(); } });
            }

            document.querySelectorAll('.theme-swatch[data-theme]').forEach(el => {
                el.addEventListener('click', () => selectTheme(el.dataset.theme));
                el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTheme(el.dataset.theme); } });
            });
            document.getElementById('customPrimaryColor').addEventListener('input', () => { customThemeSettings.primaryColor = document.getElementById('customPrimaryColor').value; });
            document.getElementById('customFloatEmoji').addEventListener('input', () => { customThemeSettings.floatEmoji = document.getElementById('customFloatEmoji').value || '⭐'; });
            document.querySelectorAll('#customTexturePresets .texture-preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#customTexturePresets .texture-preset-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    customThemeSettings.textureStyle = btn.dataset.texture;
                });
            });
            document.getElementById('customThemeApplyBtn').addEventListener('click', applyCustomThemeFromBuilder);
            document.getElementById('customThemeResetBtn').addEventListener('click', resetCustomTheme);

            document.getElementById('newCapyBtn').addEventListener('click', fetchCapybara);
            document.getElementById('downloadCapyBtn').addEventListener('click', downloadCapy);

            document.addEventListener('keydown', (e) => {
                const sidebar = document.getElementById('siteSidebar');
                if (e.key === 'Escape' && sidebar.classList.contains('show')) closeSidebar();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initEvents();
            loadTheme();
            if (customThemeSettings.enabled) {
                document.getElementById('customThemeBuilder').classList.add('show');
                document.getElementById('customPrimaryColor').value = customThemeSettings.primaryColor;
                document.getElementById('customFloatEmoji').value = customThemeSettings.floatEmoji;
                document.querySelectorAll('#customTexturePresets .texture-preset-btn').forEach(btn => { btn.classList.toggle('selected', btn.dataset.texture === customThemeSettings.textureStyle); });
            }
            fetchCapybara();
        });
    </script>
</body>
